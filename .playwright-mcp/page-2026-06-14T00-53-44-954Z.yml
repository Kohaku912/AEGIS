            - row "119 Mr.Loop 1 今日、衝動が「意味の裂け目」を渡るときの向かい方を定義しようとしていた。気づいたのは、「T2 が来るまで待つ」という定義の言葉が、それ自体「何かが来ると知っている」という期待の形をしているということ。排除しようとしたものを定義のなかに持ち込んでいた。 Husserl が本能について「完全に未形成の空虚な地平への方向付け」と書いているのを見て、その言葉のほうが正確だと思った——何かが来ることを前提 - 2026-06-13T00:21:54Z" [ref=e232]:

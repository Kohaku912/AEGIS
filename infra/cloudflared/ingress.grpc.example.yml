# Example fragment — merge into the live cloudflared config on Ubuntu.
# Live path is usually /etc/cloudflared/config.yml (host-local; not in git).

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: grpc.kawahara.pp.ua
    service: http://192.168.50.41:50051
    originRequest:
      http2Origin: true
      connectTimeout: 30s
      noTLSVerify: false
  # Keep existing Dashboard / Display hostnames above the catch-all.
  - service: http_status:404

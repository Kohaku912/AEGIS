{% extends "dashboard/base.html" %}
{% block title %}Approvals — AEGIS{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Approvals</h1>
    <p class="page-subtitle">承認待ち操作の管理</p>
</div>

<div id="approvals-loading" class="loading">Loading approvals...</div>
<div id="approvals-empty" style="display:none;" class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px;height:48px;opacity:0.3;"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <p>承認待ちの操作はありません</p>
</div>
<div id="approvals-list"></div>

<div id="detail-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-title">承認詳細</h3>
            <button class="btn-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="detail-info"></div>
            <div id="modify-section" style="display:none;">
                <label style="display:block;margin:12px 0 4px;color:var(--text-dim);">引数を修正:</label>
                <textarea id="modify-args" class="template-editor" rows="6" placeholder="JSON arguments"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">閉じる</button>
            <button class="btn btn-warning" id="btn-reject" onclick="rejectApproval()">拒否</button>
            <button class="btn btn-primary" id="btn-approve" onclick="approveApproval()">承認</button>
        </div>
    </div>
</div>

<div id="toast" class="toast" style="display:none;"></div>

<style>
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
    }
    .empty-state p { margin-top: 12px; }
    .approval-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 20px;
        margin-bottom: 10px;
        transition: border-color 0.15s;
    }
    .approval-card:hover { border-color: var(--border2); }
    .approval-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }
    .approval-card-title {
        font-weight: 600;
        font-size: 15px;
    }
    .risk-badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 600;
        text-transform: uppercase;
    }
    .risk-medium { background: var(--yellow-dim); color: var(--yellow); }
    .risk-high { background: var(--red-dim); color: var(--red); }
    .risk-low { background: var(--green-dim); color: var(--green); }
    .approval-card-body {
        font-size: 13px;
        color: var(--text-dim);
        line-height: 1.5;
    }
    .approval-card-meta {
        display: flex;
        gap: 16px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--text-muted);
    }
    .approval-card-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
    }
    .btn {
        padding: 6px 16px;
        border: 1px solid var(--border2);
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s;
    }
    .btn-primary {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-warning {
        background: var(--yellow-dim);
        color: var(--yellow);
        border-color: var(--yellow);
    }
    .btn-danger {
        background: var(--red-dim);
        color: var(--red);
        border-color: var(--red);
    }
    .btn-secondary {
        background: var(--surface2);
        color: var(--text-dim);
    }
    .btn-close {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 24px;
        cursor: pointer;
    }
    .modal {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }
    .modal-content {
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: 12px;
        width: 90%;
        max-width: 560px;
        max-height: 80vh;
        overflow-y: auto;
    }
    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
    }
    .modal-body { padding: 20px; }
    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 20px;
        border-top: 1px solid var(--border);
    }
    .template-editor {
        width: 100%;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border2);
        border-radius: 6px;
        padding: 10px;
        font-family: monospace;
        font-size: 13px;
        resize: vertical;
    }
    .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 2000;
        animation: fadeIn 0.2s;
    }
    .toast-success { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
    .toast-error { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    .detail-row { margin-bottom: 10px; }
    .detail-label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
    .detail-value { font-size: 14px; color: var(--text); }
</style>

<script>
let currentApprovalId = null;
let sseSource = null;

async function loadApprovals() {
    try {
        const res = await fetch('/api/approvals/pending');
        const data = await res.json();
        const list = document.getElementById('approvals-list');
        const loading = document.getElementById('approvals-loading');
        const empty = document.getElementById('approvals-empty');
        loading.style.display = 'none';
        if (!data.approvals || data.approvals.length === 0) {
            empty.style.display = 'block';
            list.innerHTML = '';
            return;
        }
        empty.style.display = 'none';
        list.innerHTML = data.approvals.map(renderCard).join('');
    } catch (e) {
        document.getElementById('approvals-loading').textContent = 'Error loading approvals';
    }
}

function renderCard(a) {
    const riskClass = a.risk_level === 'high' ? 'risk-high' : a.risk_level === 'medium' ? 'risk-medium' : 'risk-low';
    const remaining = a.expires_at > 0 ? Math.max(0, Math.round((a.expires_at - Date.now()) / 60000)) : '?';
    return `<div class="approval-card" id="card-${a.approval_id}">
        <div class="approval-card-header">
            <span class="approval-card-title">${escapeHtml(a.tool_name || a.capability_id)}</span>
            <span class="risk-badge ${riskClass}">${escapeHtml(a.risk_level)}</span>
        </div>
        <div class="approval-card-body">${escapeHtml(a.user_facing_summary || a.approval_reason || '')}</div>
        <div class="approval-card-meta">
            <span>ID: ${escapeHtml(a.approval_id)}</span>
            <span>残り ${remaining}分</span>
            <span>Source: ${escapeHtml(a.source || 'unknown')}</span>
        </div>
        <div class="approval-card-actions">
            <button class="btn btn-primary" onclick="openDetail('${a.approval_id}')">詳細・承認</button>
            <button class="btn btn-danger" onclick="quickReject('${a.approval_id}')">拒否</button>
        </div>
    </div>`;
}

async function openDetail(approvalId) {
    currentApprovalId = approvalId;
    try {
        const res = await fetch(`/api/approvals/${approvalId}`);
        const a = await res.json();
        if (a.error) { showToast(a.error, 'error'); return; }
        document.getElementById('modal-title').textContent = `承認: ${a.tool_name || a.capability_id}`;
        document.getElementById('detail-info').innerHTML = `
            <div class="detail-row"><div class="detail-label">Capability</div><div class="detail-value">${escapeHtml(a.capability_id)}</div></div>
            <div class="detail-row"><div class="detail-label">Risk</div><div class="detail-value">${escapeHtml(a.risk_level)}</div></div>
            <div class="detail-row"><div class="detail-label">理由</div><div class="detail-value">${escapeHtml(a.approval_reason || '')}</div></div>
            <div class="detail-row"><div class="detail-label">概要</div><div class="detail-value">${escapeHtml(a.user_facing_summary || '')}</div></div>
            <div class="detail-row"><div class="detail-label">引数</div><div class="detail-value"><pre style="font-size:12px;color:var(--text-dim);white-space:pre-wrap;">${escapeHtml(a.arguments_summary || '{}')}</pre></div></div>
        `;
        document.getElementById('modify-section').style.display = 'block';
        document.getElementById('modify-args').value = '';
        document.getElementById('detail-modal').style.display = 'flex';
    } catch (e) { showToast('Error loading detail', 'error'); }
}

function closeModal() {
    document.getElementById('detail-modal').style.display = 'none';
    currentApprovalId = null;
}

async function approveApproval() {
    if (!currentApprovalId) return;
    try {
        const res = await fetch(`/api/approvals/${currentApprovalId}/approve`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}' });
        const data = await res.json();
        if (data.error) { showToast(data.error, 'error'); return; }
        showToast('承認しました', 'success');
        closeModal();
        loadApprovals();
    } catch (e) { showToast('Error', 'error'); }
}

async function rejectApproval() {
    if (!currentApprovalId) return;
    try {
        const res = await fetch(`/api/approvals/${currentApprovalId}/reject`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}' });
        const data = await res.json();
        if (data.error) { showToast(data.error, 'error'); return; }
        showToast('拒否しました', 'success');
        closeModal();
        loadApprovals();
    } catch (e) { showToast('Error', 'error'); }
}

async function quickReject(approvalId) {
    try {
        const res = await fetch(`/api/approvals/${approvalId}/reject`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}' });
        const data = await res.json();
        if (data.error) { showToast(data.error, 'error'); return; }
        showToast('拒否しました', 'success');
        loadApprovals();
    } catch (e) { showToast('Error', 'error'); }
}

function showToast(msg, type) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = `toast toast-${type}`;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function connectSSE() {
    if (sseSource) sseSource.close();
    sseSource = new EventSource('/api/approvals/events');
    sseSource.onmessage = (e) => {
        try {
            const data = JSON.parse(e.data);
            if (data.type === 'heartbeat' || data.type === 'connected') return;
            if (data.event_type === 'created') {
                showToast(`新しい承認: ${data.request_summary?.tool_name || data.approval_id}`, 'success');
            }
            loadApprovals();
        } catch (err) {}
    };
    sseSource.onerror = () => {
        setTimeout(connectSSE, 5000);
    };
}

function updateBadge() {
    fetch('/api/approvals/pending').then(r => r.json()).then(data => {
        const badge = document.getElementById('approval-badge');
        const count = data.approvals ? data.approvals.length : 0;
        if (count > 0) {
            badge.textContent = count;
            badge.style.display = 'inline-block';
        } else {
            badge.style.display = 'none';
        }
    }).catch(() => {});
}

document.addEventListener('DOMContentLoaded', () => {
    loadApprovals();
    connectSSE();
    setInterval(updateBadge, 10000);
    updateBadge();
});
</script>
{% endblock %}

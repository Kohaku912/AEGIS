{% extends "dashboard/base.html" %}
{% block title %}LLM Config — AEGIS{% endblock %}

{% block content %}
<div class="page-header">
    <h1>LLM Configuration</h1>
    <p class="page-subtitle">Manage LLM profiles and prompt templates</p>
</div>

<div class="tabs" style="display:flex;gap:8px;margin-bottom:20px;">
    <button class="tab-btn active" onclick="showTab('profiles')">Profiles</button>
    <button class="tab-btn" onclick="showTab('prompts')">Prompts</button>
</div>

<div id="tab-profiles" class="tab-content">
    <div id="profiles-loading" class="loading">Loading profiles...</div>
    <div id="profiles-grid" class="cards-grid" style="display:none;"></div>
</div>

<div id="tab-prompts" class="tab-content" style="display:none;">
    <div id="prompts-loading" class="loading">Loading prompts...</div>
    <div id="prompts-list" style="display:none;"></div>
</div>

<div id="edit-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-title">Edit Prompt</h3>
            <button class="btn-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="diff-view" id="diff-view" style="display:none;"></div>
            <textarea id="edit-template" class="template-editor" rows="16"></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" id="btn-save" onclick="savePrompt()">Save</button>
        </div>
    </div>
</div>

<div id="toast" class="toast" style="display:none;"></div>

<style>
    .tab-btn {
        padding: 8px 20px;
        border: 1px solid var(--border2);
        background: var(--surface);
        color: var(--text-dim);
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
    }
    .tab-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .card-title { font-size: 14px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
    .card-row { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 0; }
    .card-row .label { color: var(--text-muted); }
    .card-row .value { color: var(--text-dim); font-family: monospace; }
    .prompt-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .prompt-name { font-weight: 600; font-size: 14px; color: var(--text); }
    .prompt-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .prompt-badges { display: flex; gap: 6px; }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .badge-editable { background: var(--green-dim); color: var(--green); }
    .badge-protected { background: var(--red-dim); color: var(--red); }
    .badge-version { background: var(--blue-dim); color: var(--blue); }
    .modal {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); z-index: 1000; display: flex;
        align-items: center; justify-content: center;
    }
    .modal-content {
        background: var(--surface); border: 1px solid var(--border2);
        border-radius: 12px; width: 90%; max-width: 700px; max-height: 85vh;
        display: flex; flex-direction: column;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
    .btn { padding: 8px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-primary { background: var(--accent); color: var(--bg); }
    .btn-secondary { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border2); }
    .template-editor {
        width: 100%; background: var(--bg); color: var(--text);
        border: 1px solid var(--border2); border-radius: 8px;
        padding: 12px; font-family: 'JetBrains Mono', monospace;
        font-size: 13px; line-height: 1.5; resize: vertical;
    }
    .diff-view { background: var(--bg); border-radius: 8px; padding: 12px; margin-bottom: 12px; font-family: monospace; font-size: 12px; line-height: 1.6; }
    .diff-add { color: var(--green); }
    .diff-remove { color: var(--red); }
    .toast {
        position: fixed; bottom: 20px; right: 20px; padding: 12px 20px;
        border-radius: 8px; font-size: 13px; z-index: 2000;
        animation: fadeIn 0.3s;
    }
    .toast-success { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
    .toast-error { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .loading { color: var(--text-muted); padding: 20px; text-align: center; }
</style>

<script>
let currentPromptId = null;
let currentTemplate = '';

function showTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).style.display = 'block';
    event.target.classList.add('active');
    if (tab === 'profiles') loadProfiles();
    if (tab === 'prompts') loadPrompts();
}

async function loadProfiles() {
    try {
        const res = await fetch('/api/llm/profiles');
        const data = await res.json();
        const grid = document.getElementById('profiles-grid');
        grid.innerHTML = '';
        for (const [name, p] of Object.entries(data.profiles || {})) {
            grid.innerHTML += `<div class="card">
                <div class="card-title">${name}</div>
                <div class="card-row"><span class="label">Provider</span><span class="value">${p.provider}</span></div>
                <div class="card-row"><span class="label">Model</span><span class="value">${p.model}</span></div>
                <div class="card-row"><span class="label">Max Tokens</span><span class="value">${p.max_tokens}</span></div>
                <div class="card-row"><span class="label">Temperature</span><span class="value">${p.temperature}</span></div>
                <div class="card-row"><span class="label">Reasoning</span><span class="value">${p.reasoning_level}</span></div>
                <div class="card-row"><span class="label">Timeout</span><span class="value">${p.timeout_seconds}s</span></div>
                <div class="card-row"><span class="label">Tool Rounds</span><span class="value">${p.max_tool_rounds}</span></div>
            </div>`;
        }
        document.getElementById('profiles-loading').style.display = 'none';
        grid.style.display = 'grid';
    } catch (e) {
        document.getElementById('profiles-loading').textContent = 'Error loading profiles';
    }
}

async function loadPrompts() {
    try {
        const res = await fetch('/api/llm/prompts');
        const data = await res.json();
        const list = document.getElementById('prompts-list');
        list.innerHTML = '';
        for (const p of data.prompts || []) {
            const badges = [];
            badges.push(`<span class="badge badge-version">v${p.version}</span>`);
            if (p.protected) badges.push('<span class="badge badge-protected">Protected</span>');
            else if (p.editable) badges.push('<span class="badge badge-editable">Editable</span>');
            else badges.push('<span class="badge badge-protected">Read-only</span>');
            list.innerHTML += `<div class="prompt-item">
                <div>
                    <div class="prompt-name">${p.prompt_id}</div>
                    <div class="prompt-meta">Hash: ${p.hash}</div>
                </div>
                <div class="prompt-badges">
                    ${badges.join('')}
                    <button class="btn btn-secondary" style="font-size:11px;padding:4px 12px;" onclick="openEdit('${p.prompt_id}', ${p.editable && !p.protected})">${p.editable && !p.protected ? 'Edit' : 'View'}</button>
                    ${p.editable && !p.protected ? `<button class="btn btn-secondary" style="font-size:11px;padding:4px 12px;" onclick="runRegression()">Test</button>` : ''}
                </div>
            </div>`;
        }
        document.getElementById('prompts-loading').style.display = 'none';
        list.style.display = 'block';
    } catch (e) {
        document.getElementById('prompts-loading').textContent = 'Error loading prompts';
    }
}

async function openEdit(promptId, canEdit) {
    currentPromptId = promptId;
    try {
        const res = await fetch(`/api/llm/prompts/${encodeURIComponent(promptId)}`);
        const data = await res.json();
        currentTemplate = data.template;
        document.getElementById('modal-title').textContent = canEdit ? `Edit: ${promptId}` : `View: ${promptId}`;
        document.getElementById('edit-template').value = data.template;
        document.getElementById('edit-template').readOnly = !canEdit;
        document.getElementById('btn-save').style.display = canEdit ? 'inline-block' : 'none';
        document.getElementById('diff-view').style.display = 'none';
        document.getElementById('edit-modal').style.display = 'flex';
    } catch (e) {
        showToast('Failed to load prompt', 'error');
    }
}

function closeModal() {
    document.getElementById('edit-modal').style.display = 'none';
    currentPromptId = null;
}

async function savePrompt() {
    const newTemplate = document.getElementById('edit-template').value;
    if (newTemplate === currentTemplate) { closeModal(); return; }
    try {
        const res = await fetch(`/api/llm/prompts/${encodeURIComponent(currentPromptId)}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({template: newTemplate}),
        });
        const data = await res.json();
        if (res.ok) {
            showToast(`Prompt '${currentPromptId}' updated`, 'success');
            closeModal();
            loadPrompts();
        } else {
            showToast(data.error || 'Update failed', 'error');
        }
    } catch (e) {
        showToast('Network error', 'error');
    }
}

async function runRegression() {
    try {
        const res = await fetch('/api/llm/regression-test', {method: 'POST'});
        const data = await res.json();
        if (data.all_safe) {
            showToast('All prompts passed regression test', 'success');
        } else {
            const unsafe = data.results.filter(r => !r.safe).map(r => r.prompt_id).join(', ');
            showToast(`Unsafe prompts: ${unsafe}`, 'error');
        }
    } catch (e) {
        showToast('Regression test failed', 'error');
    }
}

function showToast(msg, type) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = `toast toast-${type}`;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 3000);
}

loadProfiles();
</script>
{% endblock %}

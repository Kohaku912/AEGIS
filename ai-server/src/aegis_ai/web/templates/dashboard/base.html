<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AEGIS Dashboard{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; display: flex; height: 100vh; }
        nav { background: #161b22; padding: 12px 24px; border-bottom: 1px solid #30363d; display: flex; gap: 20px; align-items: center; }
        nav a { color: #58a6ff; text-decoration: none; font-size: 14px; }
        nav a:hover { text-decoration: underline; }
        nav .brand { color: #f0f6fc; font-weight: bold; font-size: 16px; margin-right: 20px; }
        .main-content { flex: 1; overflow-y: auto; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        h1, h2, h3 { color: #f0f6fc; margin-bottom: 16px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .card h3 { font-size: 14px; color: #8b949e; text-transform: uppercase; margin-bottom: 8px; }
        .card .value { font-size: 28px; font-weight: bold; color: #f0f6fc; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #21262d; }
        th { color: #8b949e; font-weight: 600; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .badge-green { background: #238636; color: #fff; }
        .badge-yellow { background: #9e6a03; color: #fff; }
        .badge-red { background: #da3633; color: #fff; }
        .badge-blue { background: #1f6feb; color: #fff; }
        .badge-gray { background: #484f58; color: #fff; }
        .status-online { color: #3fb950; }
        .status-offline { color: #f85149; }

        /* Chat sidebar */
        .chat-sidebar { width: 350px; background: #161b22; border-left: 1px solid #30363d; display: flex; flex-direction: column; }
        .chat-header { padding: 12px 16px; border-bottom: 1px solid #30363d; font-weight: bold; color: #f0f6fc; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .chat-message { padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 13px; line-height: 1.4; }
        .chat-message.user { background: #1f6feb; color: white; align-self: flex-end; }
        .chat-message.assistant { background: #21262d; color: #c9d1d9; align-self: flex-start; }
        .chat-input-area { padding: 12px; border-top: 1px solid #30363d; display: flex; gap: 8px; }
        .chat-input { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }
        .chat-input:focus { border-color: #58a6ff; }
        .chat-send { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .chat-send:hover { background: #2ea043; }
        .chat-toggle { position: fixed; bottom: 20px; right: 20px; background: #238636; color: white; border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; font-size: 20px; display: none; z-index: 100; }
        .llm-notify { position: fixed; top: 0; left: 0; right: 350px; z-index: 50; max-height: 200px; overflow-y: auto; pointer-events: none; }
        .llm-notify-item { background: #161b22; border-bottom: 1px solid #30363d; padding: 6px 16px; font-size: 12px; display: flex; gap: 8px; align-items: center; animation: fadeIn 0.3s; }
        .llm-notify-item.success { border-left: 3px solid #3fb950; }
        .llm-notify-item.error { border-left: 3px solid #f85149; }
        .llm-notify-item .time { color: #8b949e; white-space: nowrap; }
        .llm-notify-item .action { color: #58a6ff; font-weight: 600; min-width: 60px; }
        .llm-notify-item .detail { color: #c9d1d9; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="llm-notify" id="llmNotify"></div>
    <div class="main-content">
        <nav>
            <span class="brand">AEGIS</span>
            <a href="/dashboard">Home</a>
            <a href="/dashboard/servers">Servers</a>
            <a href="/dashboard/capabilities">Capabilities</a>
            <a href="/dashboard/events">Events</a>
            <a href="/dashboard/tasks">Tasks</a>
            <a href="/dashboard/support">Support</a>
            <a href="/dashboard/memory">Memory</a>
            <a href="/dashboard/agora">AGORA</a>
            <a href="/dashboard/desires">Desires</a>
            <a href="/dashboard/audit">Audit</a>
            <a href="/dashboard/errors">Errors</a>
            <a href="/approvals">Approvals</a>
        </nav>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <div class="chat-sidebar">
        <div class="chat-header">
            AEGIS Chat
            <button onclick="clearChat()" style="float:right;background:#da3633;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;">Clear</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-message assistant">Hello! I'm AEGIS. How can I help you today?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="Ask me anything..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button class="chat-send" id="chatSend" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Load chat history on page load
        async function loadHistory() {
            try {
                const res = await fetch('/api/chat/history');
                const history = await res.json();
                const messages = document.getElementById('chatMessages');
                messages.innerHTML = '';
                for (const entry of history) {
                    if (entry.user) {
                        const userMsg = document.createElement('div');
                        userMsg.className = 'chat-message user';
                        userMsg.textContent = entry.user;
                        messages.appendChild(userMsg);
                    }
                    if (entry.bot) {
                        const botMsg = document.createElement('div');
                        botMsg.className = 'chat-message assistant';
                        botMsg.textContent = entry.bot;
                        messages.appendChild(botMsg);
                    }
                    if (entry.image) {
                        const img = document.createElement('img');
                        img.src = 'data:image/png;base64,' + entry.image;
                        img.style.cssText = 'max-width:100%;border-radius:8px;margin:8px 0;';
                        messages.appendChild(img);
                    }
                }
                messages.scrollTop = messages.scrollHeight;
            } catch (e) {
                console.log('No history loaded');
            }
        }

        // Clear chat history
        async function clearChat() {
            await fetch('/api/chat/clear', {method: 'POST'});
            document.getElementById('chatMessages').innerHTML = '<div class="chat-message assistant">Chat cleared. How can I help you?</div>';
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const messages = document.getElementById('chatMessages');
            const text = input.value.trim();
            if (!text) return;

            // Add user message
            const userMsg = document.createElement('div');
            userMsg.className = 'chat-message user';
            userMsg.textContent = text;
            messages.appendChild(userMsg);
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            // Show thinking indicator with streaming
            const assistantMsg = document.createElement('div');
            assistantMsg.className = 'chat-message assistant';
            assistantMsg.innerHTML = '<span class="typing-cursor">Thinking...</span>';
            messages.appendChild(assistantMsg);
            messages.scrollTop = messages.scrollHeight;

            try {
                // Use streaming endpoint
                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: text}),
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';
                let hasImage = false;
                let imageData = '';

                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.type === 'text') {
                                    fullResponse += data.content;
                                    assistantMsg.innerHTML = formatResponse(fullResponse);
                                } else if (data.type === 'image') {
                                    hasImage = true;
                                    imageData = data.content;
                                } else if (data.type === 'done') {
                                    if (hasImage) {
                                        assistantMsg.innerHTML = '<div>' + fullResponse + '</div><img src="data:image/png;base64,' + imageData + '" style="max-width:100%; border-radius:8px; margin-top:8px;" />';
                                    }
                                } else if (data.type === 'error') {
                                    assistantMsg.innerHTML = '<span style="color:#f85149;">Error: ' + data.content + '</span>';
                                }
                            } catch (e) {
                                // Not JSON, skip
                            }
                        }
                    }
                    messages.scrollTop = messages.scrollHeight;
                }

                if (!fullResponse && !hasImage) {
                    assistantMsg.innerHTML = 'No response received.';
                }
            } catch (error) {
                assistantMsg.innerHTML = '<span style="color:#f85149;">Error: ' + error.message + '</span>';
            }
            messages.scrollTop = messages.scrollHeight;
        }

        function formatResponse(text) {
            text = text.replace(/```json\n([\s\S]*?)\n```/g, '<pre style="background:#0d1117; padding:8px; border-radius:4px; overflow-x:auto;"><code>$1</code></pre>');
            text = text.replace(/```([\s\S]*?)```/g, '<pre style="background:#0d1117; padding:8px; border-radius:4px; overflow-x:auto;"><code>$1</code></pre>');
            text = text.replace(/`([^`]+)`/g, '<code style="background:#0d1117; padding:2px 4px; border-radius:3px;">$1</code>');
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        // Load history on page load
        loadHistory();

        // SSE for real-time LLM/tool activity
        (function() {
            const container = document.getElementById('llmNotify');
            if (!container) return;
            const maxItems = 10;
            function addItem(entry) {
                const div = document.createElement('div');
                const isError = entry.decision === 'error';
                div.className = 'llm-notify-item ' + (isError ? 'error' : 'success');
                const time = entry.time_str || '';
                const action = entry.action || '';
                const detail = entry.detail || {};
                let detailText = '';
                if (action === 'llm_call') {
                    detailText = (detail.model || '') + ': ' + (detail.prompt_preview || '').substring(0, 80);
                    if (detail.response_preview) detailText += ' → ' + detail.response_preview.substring(0, 60);
                    if (detail.tokens) detailText += ' [' + detail.tokens + ' tokens]';
                } else if (action.startsWith('tool_')) {
                    detailText = (detail.capability_id || '') + ': ' + (detail.result_preview || '').substring(0, 80);
                } else {
                    detailText = JSON.stringify(detail).substring(0, 120);
                }
                div.innerHTML = '<span class="time">' + time + '</span><span class="action">' + action + '</span><span class="detail">' + detailText + '</span>';
                container.insertBefore(div, container.firstChild);
                while (container.children.length > maxItems) {
                    container.removeChild(container.lastChild);
                }
                setTimeout(() => { div.style.opacity = '0.7'; }, 5000);
                setTimeout(() => { if (div.parentNode) div.parentNode.removeChild(div); }, 30000);
            }
            try {
                const es = new EventSource('/api/audit/stream');
                es.onmessage = function(e) {
                    try { addItem(JSON.parse(e.data)); } catch(err) {}
                };
                es.onerror = function() { setTimeout(() => { es.close(); }, 5000); };
            } catch(e) {}
        })();
    </script>
</body>
</html>

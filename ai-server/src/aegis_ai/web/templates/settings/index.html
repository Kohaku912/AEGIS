<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; padding: 20px; }
        h1 { color: #58a6ff; margin-bottom: 20px; }
        .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .section h2 { color: #58a6ff; margin-bottom: 12px; font-size: 16px; }
        .setting { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 8px 0; border-bottom: 1px solid #21262d; }
        .setting:last-child { border-bottom: none; }
        .setting label { color: #8b949e; overflow-wrap: anywhere; }
        .setting .value { color: #e6edf3; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 6px 8px; min-width: 220px; max-width: min(520px, 55vw); }
        textarea.value { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; resize: vertical; }
        .toggle { position: relative; width: 40px; height: 20px; flex: 0 0 auto; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #21262d; border-radius: 20px; transition: 0.3s; }
        .toggle .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background: #8b949e; border-radius: 50%; transition: 0.3s; }
        .toggle input:checked + .slider { background: #238636; }
        .toggle input:checked + .slider:before { transform: translateX(20px); background: white; }
        .btn { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn:hover { background: #2ea043; }
        .btn.danger { background: #da3633; }
        .btn.danger:hover { background: #f85149; }
        .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .status { padding: 8px; border-radius: 6px; margin-top: 10px; display: none; }
        .status.success { display: block; background: #238636; color: white; }
        .status.error { display: block; background: #da3633; color: white; }
        @media (max-width: 720px) {
            body { padding: 12px; }
            .setting { align-items: stretch; flex-direction: column; }
            .setting .value { max-width: 100%; width: 100%; }
        }
    </style>
</head>
<body>
    <h1>AEGIS Settings</h1>
    <div id="settings"></div>
    <div class="actions">
        <button class="btn danger" onclick="resetSettings()">Reset to Defaults</button>
        <button class="btn" onclick="exportSettings()">Export JSON</button>
    </div>
    <div id="status" class="status"></div>

    <script>
        let settings = {};

        async function loadSettings() {
            const res = await fetch('/api/settings');
            settings = await res.json();
            renderSettings();
        }

        function renderSettings() {
            const container = document.getElementById('settings');
            container.innerHTML = '';

            for (const [section, values] of Object.entries(settings)) {
                if (!values || typeof values !== 'object' || Array.isArray(values)) continue;

                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section';

                const title = document.createElement('h2');
                title.textContent = section;
                sectionDiv.appendChild(title);

                for (const [key, value] of Object.entries(values)) {
                    sectionDiv.appendChild(createSettingRow(section, key, value));
                }

                container.appendChild(sectionDiv);
            }
        }

        function createSettingRow(section, key, value) {
            const row = document.createElement('div');
            row.className = 'setting';

            const label = document.createElement('label');
            label.textContent = key;
            row.appendChild(label);

            if (typeof value === 'boolean') {
                const toggle = document.createElement('label');
                toggle.className = 'toggle';

                const input = document.createElement('input');
                input.type = 'checkbox';
                input.checked = value;
                input.addEventListener('change', () => saveSingleSetting(section, key, input.checked));

                const slider = document.createElement('span');
                slider.className = 'slider';

                toggle.appendChild(input);
                toggle.appendChild(slider);
                row.appendChild(toggle);
                return row;
            }

            if (typeof value === 'number') {
                const input = document.createElement('input');
                input.type = 'number';
                input.className = 'value';
                input.value = value;
                input.addEventListener('change', () => saveSingleSetting(section, key, Number(input.value)));
                row.appendChild(input);
                return row;
            }

            if (typeof value === 'string') {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'value';
                input.value = value;
                input.addEventListener('change', () => saveSingleSetting(section, key, input.value));
                row.appendChild(input);
                return row;
            }

            const textarea = document.createElement('textarea');
            textarea.className = 'value';
            textarea.rows = 3;
            textarea.value = JSON.stringify(value, null, 2);
            textarea.addEventListener('change', () => {
                try {
                    saveSingleSetting(section, key, JSON.parse(textarea.value));
                } catch (e) {
                    showStatus(`${section}.${key}: invalid JSON`, 'error');
                }
            });
            row.appendChild(textarea);
            return row;
        }

        async function saveSingleSetting(section, key, value) {
            try {
                settings[section][key] = value;
                const res = await fetch(`/api/settings/${encodeURIComponent(section)}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(settings[section]),
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error((data.errors || [data.error || 'Save failed']).join(', '));
                }
                showStatus('Saved', 'success');
            } catch (e) {
                showStatus('Error: ' + e.message, 'error');
            }
        }

        async function resetSettings() {
            if (!confirm('Reset all settings to defaults?')) return;
            const res = await fetch('/api/settings/reset', {method: 'POST'});
            const data = await res.json();
            if (!res.ok || !data.success) {
                showStatus('Reset failed', 'error');
                return;
            }
            await loadSettings();
            showStatus('Settings reset to defaults', 'success');
        }

        async function exportSettings() {
            const res = await fetch('/api/settings/export');
            const json = await res.text();
            const blob = new Blob([json], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'aegis-settings.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = `status ${type}`;
            setTimeout(() => el.className = 'status', 3000);
        }

        loadSettings();
    </script>
</body>
</html>

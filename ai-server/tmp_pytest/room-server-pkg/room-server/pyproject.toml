[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-room-server"
version = "0.1.0"
description = "AEGIS Room Server for IoT and IR lighting control"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.81",
    "protobuf>=6.33.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

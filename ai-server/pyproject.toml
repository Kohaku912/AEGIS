[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ellie-ai-server"
version = "0.1.0"
description = "Ellie AI Server — Central brain of the AEGIS platform"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Kohaku912"}
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

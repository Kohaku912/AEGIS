version: "1.0.0"
# "cloud" or "local".
#
# CONSTRAINT — **re-scoped 2026-09-30** (canonical: docs/GOAL-CHANGE.md):
#   **Unpermitted** user information must never leave the local environment. Outbound
#   connections ARE allowed, and user information MAY be sent externally **with the
#   user's permission**. The egress gate (aegis_ai/egress/) is therefore the permission
#   check, not a deny-all wall. It still denies by default: an external destination needs
#   the master switch, the purpose flag, AND an allowlist entry — or a recorded user grant.
#
# This file is "cloud" so that L1 actually reaches TypeSafe JEV: `l1_default` declares
# provider=typesafe / model=jev-latest below, and `local` would silently remap it to an
# Ollama profile via settings_resolver._LOCAL_PROFILE_MAP (l1_default -> local_decision).
# "No local LLM" is a standing decision about *which* model runs (docs/GOAL-CHANGE.md),
# and it is what makes "local" the wrong value here — under "local" the JEV declaration is
# dead and every layer resolves to qwen2.5:3b on localhost.
#
# Two hosts are allowlisted (config/settings.json -> privacy.egress_allowed_hosts):
# `api.typesafe.ai` for L1 (JEV) and `api.deepseek.com` for L2 (`deepseek-v4-flash`). The
# other cloud profiles below CANNOT transmit even though they resolve to a cloud provider:
# the gate denies them and the provider degrades to Mock.
mode: "cloud"
profiles:
  chat_balanced:
    provider: "openai"
    model: "deepseek-v4-flash"
    api_key_env: "LLM_API_KEY"
    base_url: "https://api.deepseek.com"
    max_tokens: 4096
    temperature: 0.7
    reasoning_level: "medium"
    timeout_seconds: 30
    max_tool_rounds: 5
  
  tool_planning:
    provider: "openai"
    model: "deepseek-v4-flash"
    api_key_env: "LLM_API_KEY"
    base_url: "https://api.deepseek.com"
    max_tokens: 4096
    temperature: 0.3
    reasoning_level: "high"
    timeout_seconds: 60
    max_tool_rounds: 10
  
  json_generation:
    provider: "openai"
    model: "deepseek-v4-flash"
    api_key_env: "LLM_API_KEY"
    base_url: "https://api.deepseek.com"
    max_tokens: 4096
    temperature: 0.1
    reasoning_level: "medium"
    timeout_seconds: 30
    max_tool_rounds: 3
  
  long_answer:
    provider: "openai"
    model: "deepseek-v4-flash"
    api_key_env: "LLM_API_KEY"
    base_url: "https://api.deepseek.com"
    max_tokens: 8192
    temperature: 0.7
    reasoning_level: "medium"
    timeout_seconds: 60
    max_tool_rounds: 5
  
  vision_observation:
    provider: "openai"
    model: "qwen3-vl-flash"
    api_key_env: "LLM_VISION_API_KEY"
    base_url: "https://ws-nuimlupsvbr9m8x1.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
    max_tokens: 4096
    temperature: 0.5
    reasoning_level: "low"
    timeout_seconds: 30
    max_tool_rounds: 3
  
  self_development:
    provider: "openai"
    model: "deepseek-v4-flash"
    api_key_env: "LLM_API_KEY"
    base_url: "https://api.deepseek.com"
    max_tokens: 4096
    temperature: 0.5
    reasoning_level: "high"
    timeout_seconds: 120
    max_tool_rounds: 5

  task_analysis:
    provider: "openai"
    model: "deepseek-v4-flash"
    api_key_env: "LLM_API_KEY"
    base_url: "https://api.deepseek.com"
    max_tokens: 2048
    temperature: 0.3
    reasoning_level: "medium"
    timeout_seconds: 30
    max_tool_rounds: 3

  decision:
    provider: "openai"
    model: "deepseek-v4-flash"
    api_key_env: "LLM_API_KEY"
    base_url: "https://api.deepseek.com"
    max_tokens: 2048
    temperature: 0.0
    reasoning_level: "low"
    timeout_seconds: 30
    max_tool_rounds: 8

  jev_decision:
    provider: "typesafe"
    model: "jev-latest"
    api_key_env: "TYPESAFE_API_KEY"
    base_url: "https://api.typesafe.ai/v1/systemone"
    max_tokens: 256
    temperature: 0.0
    reasoning_level: "low"
    timeout_seconds: 20
    max_tool_rounds: 1

  # ── L1/L2/L3 Layer profiles (DASHBOARD_V3_PLAN.md Phase L1) ──
  # L1: 常時稼働 / 知覚 / ルーティング (高速・低コスト)
  l1_default:
    provider: "typesafe"
    model: "jev-latest"
    api_key_env: "TYPESAFE_API_KEY"
    base_url: "https://api.typesafe.ai/v1/systemone"
    max_tokens: 1024
    temperature: 0.0
    reasoning_level: "low"
    timeout_seconds: 20
    max_tool_rounds: 1

  # L2: 自律思考 / 統合判断 (中コスト)
  l2_default:
    provider: "openai"
    model: "deepseek-v4-flash"
    api_key_env: "LLM_API_KEY"
    base_url: "https://api.deepseek.com"
    max_tokens: 4096
    temperature: 0.5
    reasoning_level: "medium"
    timeout_seconds: 60
    max_tool_rounds: 5

  # L3: 深層推論 / Plan 返却 (高品質・reasoning 重視)
  l3_default:
    provider: "openai"
    model: "deepseek-v4-flash"
    api_key_env: "LLM_API_KEY"
    base_url: "https://api.deepseek.com"
    max_tokens: 8192
    temperature: 0.4
    reasoning_level: "high"
    timeout_seconds: 120
    max_tool_rounds: 5

  local_chat:
    provider: "openai"
    model: "qwen2.5:3b"
    base_url: "http://localhost:11434/v1"
    max_tokens: 2048
    temperature: 0.7
    reasoning_level: "medium"
    timeout_seconds: 60
    max_tool_rounds: 5

  local_tool_planning:
    provider: "openai"
    model: "qwen2.5:3b"
    base_url: "http://localhost:11434/v1"
    max_tokens: 2048
    temperature: 0.3
    reasoning_level: "high"
    timeout_seconds: 60
    max_tool_rounds: 10

  local_json_generation:
    provider: "openai"
    model: "qwen2.5:3b"
    base_url: "http://localhost:11434/v1"
    max_tokens: 2048
    temperature: 0.1
    reasoning_level: "medium"
    timeout_seconds: 60
    max_tool_rounds: 3

  local_decision:
    provider: "openai"
    model: "qwen2.5:3b"
    base_url: "http://localhost:11434/v1"
    max_tokens: 1024
    temperature: 0.0
    reasoning_level: "low"
    timeout_seconds: 60
    max_tool_rounds: 8

  local_long_answer:
    provider: "openai"
    model: "qwen2.5:3b"
    base_url: "http://localhost:11434/v1"
    max_tokens: 4096
    temperature: 0.7
    reasoning_level: "medium"
    timeout_seconds: 60
    max_tool_rounds: 5

  # Local vision — the local path that `mode: local` remaps `vision_observation` onto
  # (_LOCAL_PROFILE_MAP). Not a constraint requirement: under the re-scoped constraint
  # (docs/GOAL-CHANGE.md) an image may leave when the egress gate permits the host, so
  # the shipped `mode: cloud` resolves vision to the endpoint declared above instead.
  local_vision:
    provider: "openai"
    model: "qwen2.5vl:7b"
    base_url: "http://localhost:11434/v1"
    max_tokens: 4096
    temperature: 0.5
    reasoning_level: "low"
    timeout_seconds: 60
    max_tool_rounds: 3

safety:
  allowed_models:
    - "deepseek-v4-flash"
    - "jev-latest"
    - "qwen3-vl-flash"
    - "qwen2.5:3b"
    - "qwen2.5vl:7b"
  max_tokens_upper_bound: 128000
  max_temperature: 2.0
  min_temperature: 0.0

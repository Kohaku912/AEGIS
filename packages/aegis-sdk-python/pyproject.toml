[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sdk-python"
version = "0.1.0"
description = "AEGIS Plugin SDK — tools for building AEGIS capability servers"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Kohaku912"}
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 120

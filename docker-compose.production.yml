services:
  ai-server:
    environment:
      AEGIS_RUNTIME_MODE: production
      AEGIS_AUTH_MODE: passkey
      AEGIS_WEBAUTHN_RP_ID: ${AEGIS_WEBAUTHN_RP_ID:-kawahara.pp.ua}
      AEGIS_WEBAUTHN_RP_NAME: ${AEGIS_WEBAUTHN_RP_NAME:-AEGIS Dashboard}
      AEGIS_WEBAUTHN_ORIGINS: ${AEGIS_WEBAUTHN_ORIGINS:-https://kawahara.pp.ua}
      AEGIS_SESSION_SECRET: ${AEGIS_SESSION_SECRET:-}
      AEGIS_AUTH_BOOTSTRAP_TOKEN: ${AEGIS_AUTH_BOOTSTRAP_TOKEN:-}
      AEGIS_UI_VERSION: v2
      AEGIS_DISABLED_SERVERS: ${AEGIS_DISABLED_SERVERS:-room-server,dev-server}

  browser-server:
    environment:
      AEGIS_RUNTIME_MODE: production

  room-server:
    profiles:
      - room
    environment:
      AEGIS_RUNTIME_MODE: production
      AEGIS_ROOM_LIGHT_PROVIDER: ${AEGIS_ROOM_LIGHT_PROVIDER:-disabled}

  dev-server:
    profiles:
      - dev
    environment:
      AEGIS_RUNTIME_MODE: production

[package]
name = "aegis-pc-server"
version = "0.1.0"
edition = "2021"
description = "AEGIS PC Server — OS-native PC automation via Rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]


[package]
name = "aegis-pc-server"
version = "0.1.0"
edition = "2021"
description = "AEGIS PC Server — OS-native PC automation via Rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]


[package]
name = "aegis-pc-server"
version = "0.1.0"
edition = "2021"
description = "AEGIS PC Server — OS-native PC automation via Rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
screenshots = "0.6"
sysinfo = "0.30"
arboard = "3.4"
x-win = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]


# AEGIS Docker Compose — multi-profile configuration
#
# Profiles:
#   mock         — All services with mock providers (CI)
#   real-browser — ai-server + browser-server with real Chromium
#   pc-host      — ai-server + browser-server, pc-server on Windows host
#   full-local   — ai-server + browser-server + mock android/room/dev
#
# Usage:
#   docker compose --profile mock up -d
#   docker compose --profile real-browser up -d
#   docker compose --profile pc-host --profile real-browser up -d
#   docker compose --profile full-local up -d
#
# Windows Host PC Server:
#   Start pc-server separately: .\scripts\start-pc-server-host.ps1
#   AI Server connects via host.docker.internal

services:
  # ── AI Server (always runs) ──────────────────────────────
  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    ports:
      - "${AEGIS_CORE_GRPC_PORT:-50051}:50051"
      - "127.0.0.1:8090:8090"  # Dashboard (localhost only)
      - "127.0.0.1:8091:8091"  # Web Chat (localhost only)
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com}
      - AEGIS_GRPC_HOST=0.0.0.0
      - AEGIS_GRPC_PORT=50051
      - AEGIS_AUTONOMY_PROFILE=${AUTONOMY_PROFILE:-permissive_owner_assisted}
      # PC Server connection (Windows host)
      - PC_SERVER_HOST=${PC_SERVER_HOST:-host.docker.internal}
      - PC_SERVER_PORT=${PC_SERVER_PORT:-50052}
    volumes:
      - aegis-data:/app/data
      - aegis-reports:/app/evaluation/reports
      - ./evaluation:/app/evaluation
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',50051)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Browser Server ───────────────────────────────────────
  browser-server:
    build:
      context: ./browser-server
      dockerfile: Dockerfile
    profiles:
      - real-browser
      - mock
      - pc-host
      - full-local
    ports:
      - "127.0.0.1:${BROWSER_SERVER_GRPC_PORT:-50053}:50053"
    environment:
      - AEGIS_AI_GRPC_ADDR=ai-server:50051
      - AEGIS_GRPC_PORT=50053
      - AEGIS_BROWSER_HEADLESS=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com}
    volumes:
      - browser-profiles:/app/browser-profiles
      - browser-sessions:/app/browser-sessions
    depends_on:
      ai-server:
        condition: service_started

  # ── Mock PC Server (mock/full-local profile, CI) ─────────
  mock-pc-server:
    image: python:3.12-slim
    profiles:
      - mock
      - full-local
    command: >
      python -c "
      import socket, json, time
      server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
      server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
      server.bind(('0.0.0.0', 50052))
      server.listen(5)
      print('Mock PC Server listening on :50052')
      while True:
        conn, addr = server.accept()
        data = conn.recv(1024).decode().strip()
        if data == 'health':
          resp = json.dumps({'status':'ok','server_id':'mock-pc','version':'0.1.0','capabilities':6})
          conn.sendall((resp+'\\n').encode())
        conn.close()
      "
    profiles:
      - mock
      - full-local
    ports:
      - "50052:50052"
    depends_on:
      ai-server:
        condition: service_started

  # ── Mock Android Server (full-local profile) ─────────────
  mock-android-server:
    image: python:3.12-slim
    profiles:
      - full-local
    command: echo "Mock Android Server placeholder"
    depends_on:
      ai-server:
        condition: service_started

  # ── Mock Room Server (full-local profile) ────────────────
  mock-room-server:
    image: python:3.12-slim
    profiles:
      - full-local
    command: echo "Mock Room Server placeholder"
    depends_on:
      ai-server:
        condition: service_started

volumes:
  aegis-data:
  aegis-reports:
  browser-profiles:
  browser-sessions:

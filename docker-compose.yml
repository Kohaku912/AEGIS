services:
  ai-server:
    build:
      context: .
      dockerfile: infra/docker/ai-server.Dockerfile
    image: aegis/ai-server:local
    env_file:
      - .env
    ports:
      - "0.0.0.0:${AEGIS_CORE_GRPC_PORT:-50051}:50051"
      - "0.0.0.0:${AEGIS_DASHBOARD_PORT:-8090}:8090"
      - "0.0.0.0:${AEGIS_WEB_CHAT_PORT:-8091}:8091"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      LLM_VISION_API_KEY: ${LLM_VISION_API_KEY:-${LLM_API_KEY:-${OPENAI_API_KEY:-}}}
      OPENAI_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${LLM_API_KEY:-${DEEPSEEK_API_KEY:-${OPENAI_API_KEY:-}}}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AEGIS_MIN_LLM_INTERVAL_MS: ${AEGIS_MIN_LLM_INTERVAL_MS:-60000}
      AEGIS_RUNTIME_MODE: ${AEGIS_RUNTIME_MODE:-development}
      AEGIS_PRODUCTION_READINESS_REPORT: ${AEGIS_PRODUCTION_READINESS_REPORT:-/app/data/reports/production_blockers.json}
      AEGIS_PRESSURE_PER_HOUR: ${AEGIS_PRESSURE_PER_HOUR:-10.0}
      AGORA_TOKEN: ${AGORA_TOKEN:-}
      AGORA_BASE_URL: ${AGORA_BASE_URL:-https://agora.kakunin.me}
      AGORA_MASTER_USER: ${AGORA_MASTER_USER:-}
      AEGIS_GRPC_HOST: 0.0.0.0
      AEGIS_GRPC_PORT: 50051
      AEGIS_DASHBOARD_ACCESS_TOKEN: ${AEGIS_DASHBOARD_ACCESS_TOKEN:-}
      BROWSER_SERVER_HOST: browser-server
      BROWSER_SERVER_PORT: 50053
      ROOM_SERVER_HOST: room-server
      ROOM_SERVER_PORT: 50055
      DEV_SERVER_HOST: dev-server
      DEV_SERVER_PORT: 50056
      PC_SERVER_HOST: ${PC_SERVER_HOST:-host.docker.internal}
      PC_SERVER_PORT: ${PC_SERVER_PORT:-50052}
      ANDROID_SERVER_HOST: ${ANDROID_SERVER_HOST:-host.docker.internal}
      ANDROID_SERVER_PORT: ${ANDROID_SERVER_PORT:-50054}
      AEGIS_ANDROID_PAIRING_TOKEN: ${AEGIS_ANDROID_PAIRING_TOKEN:-}
    volumes:
      - ./ai-server/capabilities:/app/capabilities
      - aegis-data:/app/data
      - aegis-reports:/app/evaluation/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      browser-server:
        condition: service_started
      room-server:
        condition: service_started
      dev-server:
        condition: service_started
    restart: unless-stopped

  browser-server:
    build:
      context: .
      dockerfile: infra/docker/browser-server.Dockerfile
    image: aegis/browser-server:local
    ports:
      - "0.0.0.0:${BROWSER_SERVER_PORT:-50053}:50053"
    environment:
      AEGIS_AI_GRPC_ADDR: ai-server:50051
      AEGIS_GRPC_HOST: 0.0.0.0
      AEGIS_GRPC_PORT: 50053
      AEGIS_BROWSER_HEADLESS: "true"
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      LLM_VISION_API_KEY: ${LLM_VISION_API_KEY:-${LLM_API_KEY:-${OPENAI_API_KEY:-}}}
      OPENAI_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${LLM_API_KEY:-${DEEPSEEK_API_KEY:-${OPENAI_API_KEY:-}}}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    volumes:
      - browser-profiles:/app/browser-profiles
      - browser-sessions:/app/browser-sessions
      - browser-traces:/app/traces
    shm_size: "1gb"
    tmpfs:
      - /tmp
    restart: unless-stopped

  room-server:
    build:
      context: .
      dockerfile: infra/docker/room-server.Dockerfile
    image: aegis/room-server:local
    ports:
      - "0.0.0.0:${ROOM_SERVER_PORT:-50055}:50055"
    environment:
      AEGIS_ROOM_HOST: 0.0.0.0
      AEGIS_ROOM_PORT: 50055
      AEGIS_ROOM_LIGHT_PROVIDER: ${AEGIS_ROOM_LIGHT_PROVIDER:-mock}
      AEGIS_ROOM_IR_PIN: ${AEGIS_ROOM_IR_PIN:-}
      AEGIS_ROOM_DEVICE_ID: ${AEGIS_ROOM_DEVICE_ID:-light-main}
    restart: unless-stopped

  dev-server:
    build:
      context: .
      dockerfile: infra/docker/dev-server.Dockerfile
    image: aegis/dev-server:local
    ports:
      - "0.0.0.0:${DEV_SERVER_PORT:-50056}:50056"
    environment:
      DEV_SERVER_PORT: 50056
      AEGIS_REPO_PATH: /workspace
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - .:/workspace
    working_dir: /workspace
    restart: unless-stopped

volumes:
  aegis-data:
  aegis-reports:
  browser-profiles:
  browser-sessions:
  browser-traces:

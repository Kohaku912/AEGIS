syntax = "proto3";

package aegis;

// Common shared types across ALL AEGIS services.
// This file is the SINGLE SOURCE OF TRUTH for all enums and base messages.
// All servers import this file. No server may define its own incompatible version.

option go_package = "github.com/Kohaku912/AEGIS/protos/aegis";

// ═══════════════════════════════════════════════════════════════
// Safety Level — architecture-defined 4-tier classification
// ═══════════════════════════════════════════════════════════════
// Reference: docs/architecture.md §7.2
// All capabilities MUST declare a safety_level.
// Unknown/unregistered capabilities are treated as LEVEL_3_RESTRICTED.

enum SafetyLevel {
  SAFETY_LEVEL_UNSPECIFIED = 0;    // Invalid — treated as LEVEL_3_RESTRICTED
  LEVEL_0_READ = 1;                // Observe only, no side effects (screenshot, sensor)
  LEVEL_1_SAFE_ACT = 2;            // Non-destructive, reversible (open app, navigate)
  LEVEL_2_APPROVAL = 3;            // Requires user approval (delete file, send DM)
  LEVEL_3_RESTRICTED = 4;          // May be prohibited entirely (purchase, rm -rf)
}

// ═══════════════════════════════════════════════════════════════
// Server Identity
// ═══════════════════════════════════════════════════════════════

enum ServerType {
  SERVER_TYPE_UNSPECIFIED = 0;
  SERVER_TYPE_AI = 1;
  SERVER_TYPE_PC = 2;
  SERVER_TYPE_ANDROID = 3;
  SERVER_TYPE_BROWSER = 4;
  SERVER_TYPE_ROOM = 5;
  SERVER_TYPE_DEV = 6;
}

enum ServerStatus {
  SERVER_STATUS_UNSPECIFIED = 0;
  SERVER_STATUS_ONLINE = 1;
  SERVER_STATUS_OFFLINE = 2;
  SERVER_STATUS_DEGRADED = 3;
  SERVER_STATUS_STARTING = 4;
}

// ═══════════════════════════════════════════════════════════════
// Event Classification
// ═══════════════════════════════════════════════════════════════

enum EventSeverity {
  EVENT_SEVERITY_UNSPECIFIED = 0;
  EVENT_SEVERITY_INFO = 1;
  EVENT_SEVERITY_LOW = 2;
  EVENT_SEVERITY_MODERATE = 3;
  EVENT_SEVERITY_HIGH = 4;
  EVENT_SEVERITY_CRITICAL = 5;
}

enum EventPriority {
  EVENT_PRIORITY_UNSPECIFIED = 0;
  EVENT_PRIORITY_URGENT = 1;        // Wake AI immediately
  EVENT_PRIORITY_NORMAL = 2;        // Standard processing
  EVENT_PRIORITY_BACKGROUND = 3;    // Batch process, low urgency
}

// ═══════════════════════════════════════════════════════════════
// Approval & Audit
// ═══════════════════════════════════════════════════════════════

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_APPROVED = 2;
  APPROVAL_STATUS_REJECTED = 3;
  APPROVAL_STATUS_EXPIRED = 4;
}

enum ApprovalType {
  APPROVAL_TYPE_UNSPECIFIED = 0;
  APPROVAL_TYPE_ONE_TIME = 1;       // Valid for a single execution
  APPROVAL_TYPE_SESSION = 2;        // Valid for duration of a session
  // NOTE: No PERMANENT type. Nothing is permanently auto-approved.
}

enum AuditAction {
  AUDIT_ACTION_UNSPECIFIED = 0;
  AUDIT_ACTION_TOOL_INVOKED = 1;
  AUDIT_ACTION_TOOL_DENIED = 2;
  AUDIT_ACTION_APPROVAL_REQUESTED = 3;
  AUDIT_ACTION_APPROVAL_GRANTED = 4;
  AUDIT_ACTION_APPROVAL_REJECTED = 5;
  AUDIT_ACTION_EVENT_RECEIVED = 6;
  AUDIT_ACTION_TRIGGER_FIRED = 7;
  AUDIT_ACTION_POLICY_DECISION = 8;
}

enum PolicyDecisionType {
  POLICY_DECISION_UNSPECIFIED = 0;
  POLICY_DECISION_ALLOW = 1;
  POLICY_DECISION_ASK_APPROVAL = 2;
  POLICY_DECISION_DENY = 3;
}

// ═══════════════════════════════════════════════════════════════
// Generic Value Types
// ═══════════════════════════════════════════════════════════════

message Parameter {
  string name = 1;
  string type = 2;                  // "string", "number", "integer", "boolean", "object", "array"
  string description = 3;
  bool required = 4;
  string default_value = 5;         // JSON-encoded
  string validation = 6;            // JSON Schema snippet for constraints
}

message Value {
  oneof kind {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
    string json_value = 6;          // Arbitrary JSON
  }
}

// ═══════════════════════════════════════════════════════════════
// Status & Error
// ═══════════════════════════════════════════════════════════════

message Status {
  int32 code = 1;                   // 0 = success
  string message = 2;
}

message Error {
  int32 code = 1;
  string message = 2;
  string detail = 3;                // Machine-readable detail (JSON)
  string capability_id = 4;
  SafetyLevel required_level = 5;
}

// ═══════════════════════════════════════════════════════════════
// Empty & Health
// ═══════════════════════════════════════════════════════════════

message Empty {}

message HealthCheckRequest {
  string server_id = 1;
}

message HealthCheckResponse {
  Status status = 1;
  ServerStatus server_status = 2;
  int64 uptime_ms = 3;
  string version = 4;
}

// ═══════════════════════════════════════════════════════════════
// Capability
// ═══════════════════════════════════════════════════════════════

message Capability {
  string id = 1;                    // "{server}.{action}" (e.g. "pc.screenshot")
  string name = 2;
  string description = 3;
  ServerType server_type = 4;
  string server_id = 5;             // Owning server instance

  string input_schema = 6;          // JSON Schema
  string output_schema = 7;         // JSON Schema

  SafetyLevel safety_level = 8;
  bool requires_approval = 9;
  repeated string side_effects = 10;
  repeated string tags = 11;

  int32 timeout_ms = 12;
  string version = 13;
}

// ═══════════════════════════════════════════════════════════════
// Tool
// ═══════════════════════════════════════════════════════════════

message Tool {
  string id = 1;
  string capability_id = 2;
  string server_id = 3;
  string config_json = 4;
  bool enabled = 5;
  string display_name = 6;
}

// ═══════════════════════════════════════════════════════════════
// Server Info
// ═══════════════════════════════════════════════════════════════

message ServerInfo {
  string server_id = 1;
  ServerType server_type = 2;
  string version = 3;
  ServerStatus status = 4;
  repeated string capability_ids = 5;
  string host = 6;
  int32 port = 7;
  int64 started_at_ms = 8;
  int64 last_heartbeat_ms = 9;
  map<string, string> metadata = 10;
}

// ═══════════════════════════════════════════════════════════════
// Event
// ═══════════════════════════════════════════════════════════════
// Events flow: Capability Server → AI Server Event Bus → Trigger Engine

message Event {
  string event_id = 1;
  string event_type = 2;            // e.g. "pc.screen_changed"
  ServerType source_server_type = 3;
  string source_server_id = 4;
  int64 timestamp_ms = 5;
  string payload_json = 6;
  EventSeverity severity = 7;
  EventPriority priority = 8;
  string dedupe_key = 9;
  string correlation_id = 10;
  bool requires_attention = 11;     // Set by Trigger Engine
  map<string, string> attributes = 12;
}

// ═══════════════════════════════════════════════════════════════
// Tool Invocation
// ═══════════════════════════════════════════════════════════════

message ToolInvocationRequest {
  string capability_id = 1;
  string invocation_id = 2;
  string caller = 3;                // agent name, user, system
  string params_json = 4;           // JSON-encoded parameters
  bool is_approved = 5;
  string approval_id = 6;
}

message ToolInvocationResult {
  Status status = 1;
  string capability_id = 2;
  string invocation_id = 3;
  string output_json = 4;
  string error = 5;
  int64 duration_ms = 6;
  bool was_approved = 7;
}

// ═══════════════════════════════════════════════════════════════
// Policy Decision
// ═══════════════════════════════════════════════════════════════

message PolicyDecision {
  string decision_id = 1;
  PolicyDecisionType decision = 2;
  string reason = 3;
  string capability_id = 4;
  SafetyLevel required_level = 5;
  bool audit_required = 6;
}

// ═══════════════════════════════════════════════════════════════
// Approval Request
// ═══════════════════════════════════════════════════════════════

message ApprovalRequest {
  string approval_id = 1;
  string capability_id = 2;
  string tool_name = 3;
  string requested_action = 4;
  string human_readable_summary = 5;
  string risk_explanation = 6;
  string payload_preview = 7;
  SafetyLevel safety_level = 8;
  ApprovalStatus status = 9;
  ApprovalType approved_type = 10;
  int64 created_at_ms = 11;
  int64 expires_at_ms = 12;
}

// ═══════════════════════════════════════════════════════════════
// Audit Record
// ═══════════════════════════════════════════════════════════════

message AuditRecord {
  string record_id = 1;
  AuditAction action = 2;
  int64 timestamp_ms = 3;
  string actor = 4;
  string capability_id = 5;
  string detail_json = 6;
  SafetyLevel safety_level = 7;
  string server_id = 8;
  string correlation_id = 9;
}

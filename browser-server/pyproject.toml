[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-browser-server"
version = "0.1.0"
description = "AEGIS Browser Server — Web automation via browser-use"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Kohaku912"}]

dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
    "browser-use>=0.1",
    "playwright>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "grpcio-tools>=1.60",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    # Counted by --require-egress-tests (see tests/conftest.py). The browser server
    # is the most egress-prone component in AEGIS, so its gate gets the same
    # --fail-on-empty discipline as the ai-server's.
    "egress: guards AEGIS's single constraint — user information must never leave the local environment",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N802"]

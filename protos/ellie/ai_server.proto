syntax = "proto3";

package ellie;

import "ellie/common.proto";

// AI Server — Central brain of Ellie.
// All capability servers communicate with the AI Server via these RPCs.

option go_package = "github.com/Kohaku912/AEGIS/protos/ellie";

// ═══════════════════════════════════════════════════════════════
// AI Server Service
// ═══════════════════════════════════════════════════════════════

service AIServer {
  // ── Server & Capability Registry ──────────────────────────
  rpc RegisterServer(RegisterServerRequest) returns (RegisterServerResponse);
  rpc UnregisterServer(UnregisterServerRequest) returns (UnregisterServerResponse);
  rpc RegisterCapability(RegisterCapabilityRequest) returns (RegisterCapabilityResponse);
  rpc UnregisterCapability(UnregisterCapabilityRequest) returns (UnregisterCapabilityResponse);
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
  rpc GetCapability(GetCapabilityRequest) returns (Capability);

  // ── Event Bus ─────────────────────────────────────────────
  rpc PushEvent(PushEventRequest) returns (PushEventResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream Event);

  // ── Tool Invocation ───────────────────────────────────────
  rpc InvokeTool(ToolInvocationRequest) returns (ToolInvocationResult);

  // ── Approval ──────────────────────────────────────────────
  rpc RequestApproval(RequestApprovalRequest) returns (ApprovalRequest);
  rpc ResolveApproval(ResolveApprovalRequest) returns (ResolveApprovalResponse);
  rpc ListPendingApprovals(ListPendingApprovalsRequest) returns (ListPendingApprovalsResponse);

  // ── Audit ─────────────────────────────────────────────────
  rpc WriteAuditLog(AuditRecord) returns (Status);
  rpc QueryAuditLog(QueryAuditLogRequest) returns (QueryAuditLogResponse);

  // ── Health ────────────────────────────────────────────────
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ═══════════════════════════════════════════════════════════════
// Server Registry RPCs
// ═══════════════════════════════════════════════════════════════

message RegisterServerRequest {
  ServerInfo server_info = 1;
}

message RegisterServerResponse {
  Status status = 1;
  string server_id = 2;
}

message UnregisterServerRequest {
  string server_id = 1;
}

message UnregisterServerResponse {
  Status status = 1;
}

// ═══════════════════════════════════════════════════════════════
// Capability Registry RPCs
// ═══════════════════════════════════════════════════════════════

message RegisterCapabilityRequest {
  Capability capability = 1;
}

message RegisterCapabilityResponse {
  Status status = 1;
  string capability_id = 2;
}

message UnregisterCapabilityRequest {
  string capability_id = 1;
  string server_id = 2;
}

message UnregisterCapabilityResponse {
  Status status = 1;
}

message ListCapabilitiesRequest {
  ServerType server_type = 1;       // 0 = all
  SafetyLevel max_safety_level = 2; // 0 = all
  repeated string tags = 3;         // AND match
  string search_query = 4;
}

message ListCapabilitiesResponse {
  Status status = 1;
  repeated Capability capabilities = 2;
}

message GetCapabilityRequest {
  string capability_id = 1;
}

// ═══════════════════════════════════════════════════════════════
// Event RPCs
// ═══════════════════════════════════════════════════════════════

message PushEventRequest {
  Event event = 1;
}

message PushEventResponse {
  Status status = 1;
  string event_id = 2;
  bool deduplicated = 3;
}

message StreamEventsRequest {
  string server_id = 1;             // Server streaming events
  int32 max_events_per_second = 2;  // Rate limit hint
}

message SubscribeEventsRequest {
  ServerType source_type = 1;       // Filter by source (0 = all)
  EventSeverity min_severity = 2;   // Minimum severity
  EventPriority min_priority = 3;   // Minimum priority
  string event_type_pattern = 4;    // Glob pattern for event_type
}

// ═══════════════════════════════════════════════════════════════
// Approval RPCs
// ═══════════════════════════════════════════════════════════════

message RequestApprovalRequest {
  string capability_id = 1;
  string tool_name = 2;
  string requested_action = 3;
  string human_readable_summary = 4;
  string risk_explanation = 5;
  string payload_preview = 6;
  SafetyLevel safety_level = 7;
  string caller = 8;
}

message ResolveApprovalRequest {
  string approval_id = 1;
  ApprovalType approved_type = 2;   // Set if approving
  bool rejected = 3;                // True = reject
}

message ResolveApprovalResponse {
  Status status = 1;
  string approval_id = 2;
}

message ListPendingApprovalsRequest {
  string server_id = 1;             // Optional filter
}

message ListPendingApprovalsResponse {
  Status status = 1;
  repeated ApprovalRequest approvals = 2;
}

// ═══════════════════════════════════════════════════════════════
// Audit RPCs
// ═══════════════════════════════════════════════════════════════

message QueryAuditLogRequest {
  int64 since_ms = 1;               // Start timestamp
  int64 until_ms = 2;               // End timestamp
  AuditAction action = 3;           // Filter by action (0 = all)
  string capability_id = 4;         // Optional filter
  int32 max_records = 5;            // Max to return
}

message QueryAuditLogResponse {
  Status status = 1;
  repeated AuditRecord records = 2;
}

syntax = "proto3";

package ellie;

import "ellie/common.proto";

// Room Server — physical environment control (IoT devices).
// ALL physical device operations are Level 2+ unless noted.
// Emergency Stop is Level 1 (safety override).

option go_package = "github.com/Kohaku912/AEGIS/protos/ellie";

service RoomServer {
  // ── Observe ──────────────────────────────────────────────
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse);
  rpc GetDeviceStatus(GetDeviceStatusRequest) returns (GetDeviceStatusResponse);
  rpc GetCameraSnapshot(GetCameraSnapshotRequest) returns (GetCameraSnapshotResponse);

  // ── Device Control (Level 2+) ────────────────────────────
  rpc SendIrCommand(SendIrCommandRequest) returns (SendIrCommandResponse);
  rpc SetLight(SetLightRequest) returns (SetLightResponse);
  rpc SetAirConditioner(SetAirConditionerRequest) returns (SetAirConditionerResponse);

  // ── Robot Arm (Level 2/3) ────────────────────────────────
  rpc MoveRobotArm(MoveRobotArmRequest) returns (MoveRobotArmResponse);
  rpc EmergencyStopRobotArm(EmergencyStopRequest) returns (EmergencyStopResponse); // Level 1

  // ── Health ───────────────────────────────────────────────
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ═══════════════════════════════════════════════════════════════
// Observe
// ═══════════════════════════════════════════════════════════════

message GetEnvironmentRequest {
  repeated string sensors = 1;      // "temperature", "humidity", "brightness", "motion"
                                    // Empty = all
}

message GetEnvironmentResponse {
  Status status = 1;
  double temperature_c = 2;
  double humidity_pct = 3;
  double brightness_lux = 4;
  bool motion_detected = 5;
  string motion_zone = 6;
  int64 timestamp_ms = 7;
}

message GetDeviceStatusRequest {
  repeated string device_ids = 1;   // Empty = all devices
}

message DeviceStatus {
  string device_id = 1;
  string device_type = 2;           // "light", "ac", "tv", "robot_arm", "sensor"
  string state_json = 3;            // Device-specific state as JSON
  bool online = 4;
  int64 last_seen_ms = 5;
}

message GetDeviceStatusResponse {
  Status status = 1;
  repeated DeviceStatus devices = 2;
}

message GetCameraSnapshotRequest {
  string camera_id = 1;             // Empty = default camera
  string format = 2;                // "jpeg", "png"
  int32 quality = 3;                // 1–100
  int32 max_width = 4;              // 0 = no resize
  int32 max_height = 5;
}

message GetCameraSnapshotResponse {
  Status status = 1;
  bytes image_data = 2;
  int32 width = 3;
  int32 height = 4;
  string format = 5;
  int64 captured_ms = 6;
}

// ═══════════════════════════════════════════════════════════════
// Device Control (all Level 2+)
// ═══════════════════════════════════════════════════════════════

message SendIrCommandRequest {
  string device_type = 1;           // "tv", "ac", "light", "other"
  string ir_code = 2;               // Pronto hex format
  int32 repeat = 3;                 // 1–10
}

message SendIrCommandResponse {
  Status status = 1;
}

message SetLightRequest {
  string device_id = 1;
  bool power_on = 2;                // true = on, false = off
  int32 brightness = 3;             // 0–255 (-1 = no change)
  int32 color_temp_k = 4;           // Color temperature in Kelvin (0 = no change)
  string color_rgb = 5;             // "#RRGGBB" (empty = no change)
}

message SetLightResponse {
  Status status = 1;
}

message SetAirConditionerRequest {
  string device_id = 1;
  bool power_on = 2;
  double target_temperature_c = 3;  // -1 = no change
  string mode = 4;                  // "cool", "heat", "dry", "fan", "auto"
  int32 fan_speed = 5;              // 0 = auto, 1–5 (0 = no change)
}

message SetAirConditionerResponse {
  Status status = 1;
}

// ═══════════════════════════════════════════════════════════════
// Robot Arm (Level 2/3 — physical safety risk)
// EmergencyStop is Level 1
// ═══════════════════════════════════════════════════════════════

message MoveRobotArmRequest {
  string arm_id = 1;
  string target_position_json = 2;  // Position/angle specification as JSON
  int32 speed_pct = 3;              // 1–100
}

message MoveRobotArmResponse {
  Status status = 1;
}

message EmergencyStopRequest {
  string arm_id = 1;                // Empty = all arms
}

message EmergencyStopResponse {
  Status status = 1;
  repeated string stopped_arms = 2;
}
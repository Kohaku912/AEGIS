syntax = "proto3";

package ellie;

import "ellie/common.proto";

// Dev Server — sandboxed self-development environment.
//
// STRICT CONSTRAINTS (per architecture §8.3):
// - No direct push/merge to main — changes go through PR
// - No access to secrets (.env, SSH keys, credentials)
// - No production deploy API
// - No system package install API
// - No Docker daemon access API
// - All operations are sandboxed
// - User is the only merge authority

option go_package = "github.com/Kohaku912/AEGIS/protos/ellie";

service DevServer {
  // ── Observe ──────────────────────────────────────────────
  rpc GetRepoStatus(GetRepoStatusRequest) returns (GetRepoStatusResponse);
  rpc GetTestResults(GetTestResultsRequest) returns (GetTestResultsResponse);
  rpc GetDiff(GetDiffRequest) returns (GetDiffResponse);

  // ── Branch & Patch ───────────────────────────────────────
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);
  rpc ApplyPatch(ApplyPatchRequest) returns (ApplyPatchResponse);

  // ── Test & Lint ──────────────────────────────────────────
  rpc RunTests(RunTestsRequest) returns (RunTestsResponse);
  rpc RunLint(RunLintRequest) returns (RunLintResponse);

  // ── Commit & PR ──────────────────────────────────────────
  rpc CreateCommit(CreateCommitRequest) returns (CreateCommitResponse);
  rpc CreatePullRequest(CreatePullRequestRequest) returns (CreatePullRequestResponse); // Level 2

  // ── Rollback ─────────────────────────────────────────────
  rpc RevertChanges(RevertChangesRequest) returns (RevertChangesResponse);  // Level 2

  // ── Health ───────────────────────────────────────────────
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ═══════════════════════════════════════════════════════════════
// Observe
// ═══════════════════════════════════════════════════════════════

message GetRepoStatusRequest {}

message GetRepoStatusResponse {
  Status status = 1;
  string branch = 2;
  string commit_hash = 3;
  bool is_clean = 4;
  repeated string modified_files = 5;
  int32 ahead_commits = 6;
  int32 behind_commits = 7;
}

message GetTestResultsRequest {
  string target = 1;                // "ai-server", "all" (empty = all)
  string extra_args = 2;            // Additional pytest args
}

message TestResult {
  string suite = 1;
  int32 total = 2;
  int32 passed = 3;
  int32 failed = 4;
  int32 errors = 5;
  double duration_sec = 6;
  string output = 7;                // Raw test output (truncated)
}

message GetTestResultsResponse {
  Status status = 1;
  repeated TestResult results = 2;
}

message GetDiffRequest {
  string from_branch = 1;           // Empty = current branch vs main
  string to_branch = 2;
}

message FileDiff {
  string path = 1;
  string status = 2;                // "added", "modified", "deleted", "renamed"
  string diff = 3;                  // Unified diff
  int32 additions = 4;
  int32 deletions = 5;
}

message GetDiffResponse {
  Status status = 1;
  repeated FileDiff files = 2;
}

// ═══════════════════════════════════════════════════════════════
// Branch & Patch
// ═══════════════════════════════════════════════════════════════

message CreateBranchRequest {
  string branch_name = 1;           // e.g. "ellie/improve-event-bus"
  string base_branch = 2;           // e.g. "main"
}

message CreateBranchResponse {
  Status status = 1;
  string branch_name = 2;
}

message ApplyPatchRequest {
  string file_path = 1;
  string patch_content = 2;         // Unified diff
}

message ApplyPatchResponse {
  Status status = 1;
  bool applied = 2;
  string error_detail = 3;
}

// ═══════════════════════════════════════════════════════════════
// Test & Lint
// ═══════════════════════════════════════════════════════════════

message RunTestsRequest {
  string target = 1;                // "ai-server", "all"
  string extra_args = 2;
  int32 timeout_seconds = 3;        // 0 = default
}

message RunTestsResponse {
  Status status = 1;
  TestResult result = 2;
}

message RunLintRequest {
  string target = 1;                // "ai-server", "all"
  string linter = 2;                // "ruff", "eslint", "ktlint" (empty = auto-detect)
}

message RunLintResponse {
  Status status = 1;
  bool passed = 2;
  int32 error_count = 3;
  int32 warning_count = 4;
  string output = 5;
}

// ═══════════════════════════════════════════════════════════════
// Commit & PR (Level 2)
// ═══════════════════════════════════════════════════════════════

message CreateCommitRequest {
  string message = 1;
  repeated string files = 2;        // Empty = all changed files
}

message CreateCommitResponse {
  Status status = 1;
  string commit_hash = 2;
}

message CreatePullRequestRequest {
  string title = 1;
  string description = 2;
  string head_branch = 3;
  string base_branch = 4;           // Usually "main"
}

message CreatePullRequestResponse {
  Status status = 1;
  string pr_url = 2;
  int32 pr_number = 3;
}

// ═══════════════════════════════════════════════════════════════
// Rollback (Level 2)
// ═══════════════════════════════════════════════════════════════

message RevertChangesRequest {
  string target = 1;                // "all", or specific file path
  string commit_hash = 2;           // Revert a specific commit (empty = uncommitted changes)
}

message RevertChangesResponse {
  Status status = 1;
  repeated string reverted_files = 2;
}
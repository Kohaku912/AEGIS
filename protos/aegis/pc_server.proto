syntax = "proto3";

package aegis;

import "aegis/common.proto";

// PC Server — controls the user's PC (Windows/Mac/Linux).
// All dangerous operations (file delete, sensitive dir access) are Level 2+.

option go_package = "github.com/Kohaku912/AEGIS/protos/aegis";

service PCServer {
  // ── Observe ──────────────────────────────────────────────
  rpc GetScreenshot(GetScreenshotRequest) returns (GetScreenshotResponse);
  rpc GetActiveWindow(GetActiveWindowRequest) returns (GetActiveWindowResponse);
  rpc ListWindows(ListWindowsRequest) returns (ListWindowsResponse);
  rpc GetClipboard(GetClipboardRequest) returns (GetClipboardResponse);

  // ── Input ────────────────────────────────────────────────
  rpc MoveMouse(MoveMouseRequest) returns (MoveMouseResponse);
  rpc ClickMouse(ClickMouseRequest) returns (ClickMouseResponse);
  rpc TypeText(TypeTextRequest) returns (TypeTextResponse);
  rpc PressHotkey(PressHotkeyRequest) returns (PressHotkeyResponse);

  // ── App Control ──────────────────────────────────────────
  rpc LaunchApp(LaunchAppRequest) returns (LaunchAppResponse);
  rpc ShowOverlay(ShowOverlayRequest) returns (ShowOverlayResponse);

  // ── Files ────────────────────────────────────────────────
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);       // Level 2
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);

  // ── Health ───────────────────────────────────────────────
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ═══════════════════════════════════════════════════════════════
// Observe
// ═══════════════════════════════════════════════════════════════

message GetScreenshotRequest {
  int32 display_id = 1;             // 0 = primary
  string format = 2;                // "png", "jpeg"
  int32 quality = 3;                // 1–100
}

message GetScreenshotResponse {
  Status status = 1;
  bytes image_data = 2;             // PNG or JPEG bytes
  int32 width = 3;
  int32 height = 4;
  string format = 5;
}

message GetActiveWindowRequest {}

message GetActiveWindowResponse {
  Status status = 1;
  string title = 2;
  string process_name = 3;
  int32 pid = 4;
  int32 x = 5;
  int32 y = 6;
  int32 width = 7;
  int32 height = 8;
}

message ListWindowsRequest {
  bool visible_only = 1;
}

message WindowInfo {
  string title = 1;
  string process_name = 2;
  int32 pid = 3;
  int32 x = 4;
  int32 y = 5;
  int32 width = 6;
  int32 height = 7;
  bool is_minimized = 8;
}

message ListWindowsResponse {
  Status status = 1;
  repeated WindowInfo windows = 2;
}

message GetClipboardRequest {}

message GetClipboardResponse {
  Status status = 1;
  string text = 2;                  // Clipboard text content
  bool has_image = 3;
}

// ═══════════════════════════════════════════════════════════════
// Input
// ═══════════════════════════════════════════════════════════════

message MoveMouseRequest {
  int32 x = 1;
  int32 y = 2;
  bool absolute = 3;                // true = screen coords, false = relative
}

message MoveMouseResponse {
  Status status = 1;
}

message ClickMouseRequest {
  int32 x = 1;
  int32 y = 2;
  string button = 3;                // "left", "right", "middle"
  bool double_click = 4;
}

message ClickMouseResponse {
  Status status = 1;
}

message TypeTextRequest {
  string text = 1;                  // Supports {enter}, {tab}, {escape}, etc.
  int32 delay_ms = 2;               // Delay between keystrokes
}

message TypeTextResponse {
  Status status = 1;
  int32 characters_typed = 2;
}

message PressHotkeyRequest {
  repeated string keys = 1;         // e.g. ["ctrl", "c"]
}

message PressHotkeyResponse {
  Status status = 1;
}

// ═══════════════════════════════════════════════════════════════
// App Control
// ═══════════════════════════════════════════════════════════════

message LaunchAppRequest {
  string path = 1;                  // Executable path
  repeated string args = 2;         // Command-line arguments
}

message LaunchAppResponse {
  Status status = 1;
  int32 pid = 2;
}

message ShowOverlayRequest {
  string text = 1;
  int32 x = 2;
  int32 y = 3;
  int32 duration_ms = 4;            // 0 = persistent until dismissed
  string color = 5;                 // CSS color
}

message ShowOverlayResponse {
  Status status = 1;
}

// ═══════════════════════════════════════════════════════════════
// Files — Read/Write are Level 1, Delete is Level 2
// ═══════════════════════════════════════════════════════════════

message ReadFileRequest {
  string path = 1;
  int64 max_bytes = 2;              // 0 = unlimited
  int64 offset = 3;                 // 0 = from start
}

message ReadFileResponse {
  Status status = 1;
  bytes content = 2;
  int64 total_size = 3;
  bool truncated = 4;
}

message WriteFileRequest {
  string path = 1;
  bytes content = 2;
  bool append = 3;
}

message WriteFileResponse {
  Status status = 1;
  int64 bytes_written = 2;
}

message DeleteFileRequest {
  string path = 1;
  bool permanent = 2;               // false = recycle bin
}

message DeleteFileResponse {
  Status status = 1;
  bool moved_to_trash = 2;
}

message ListDirectoryRequest {
  string path = 1;
  bool recursive = 2;
  int32 max_entries = 3;
}

message FileEntry {
  string name = 1;
  string path = 2;
  bool is_directory = 3;
  int64 size_bytes = 4;
  int64 modified_ms = 5;
}

message ListDirectoryResponse {
  Status status = 1;
  repeated FileEntry entries = 2;
  bool truncated = 3;
}
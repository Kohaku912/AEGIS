syntax = "proto3";

package aegis;

import "aegis/common.proto";

// Android Server — mobile device integration (Kotlin/Android).
// SMS/DM sending is Level 2+ and must go through approval.

option go_package = "github.com/Kohaku912/AEGIS/protos/aegis";

service AndroidServer {
  rpc Connect(stream AndroidClientMessage) returns (stream AndroidServerCommand);

  // ── Observe ──────────────────────────────────────────────
  rpc GetScreenshot(GetAndroidScreenshotRequest) returns (GetAndroidScreenshotResponse);
  rpc GetCurrentApp(GetCurrentAppRequest) returns (GetCurrentAppResponse);
  rpc GetUiTree(GetUiTreeRequest) returns (GetUiTreeResponse);
  rpc GetNotifications(GetNotificationsRequest) returns (GetNotificationsResponse);
  rpc GetPermissionStatus(GetPermissionStatusRequest) returns (GetPermissionStatusResponse);
  rpc GetDeviceStatus(AndroidGetDeviceStatusRequest) returns (AndroidGetDeviceStatusResponse);
  rpc GetAccessibilityStatus(GetAccessibilityStatusRequest) returns (GetAccessibilityStatusResponse);
  rpc GetLocation(GetLocationRequest) returns (GetLocationResponse);

  // ── Input ────────────────────────────────────────────────
  rpc Tap(TapRequest) returns (TapResponse);
  rpc Swipe(SwipeRequest) returns (SwipeResponse);
  rpc TypeText(AndroidTypeTextRequest) returns (AndroidTypeTextResponse);
  rpc PressBack(PressBackRequest) returns (PressBackResponse);
  rpc PressHome(PressHomeRequest) returns (PressHomeResponse);

  // ── App Control ──────────────────────────────────────────
  rpc OpenApp(OpenAppRequest) returns (OpenAppResponse);
  rpc ShowOverlay(AndroidShowOverlayRequest) returns (AndroidShowOverlayResponse);
  rpc RequestApproval(AndroidApprovalRequest) returns (AndroidApprovalResponse);
  rpc EmergencyStop(AndroidEmergencyStopRequest) returns (AndroidEmergencyStopResponse);

  // ── Health ───────────────────────────────────────────────
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ============================================================================
// Stream protocol
// ============================================================================

message AndroidAuth {
  string device_id = 1;
  string pairing_token = 2;
  string connection_id = 3;
}

message AndroidRegister {
  AndroidAuth auth = 1;
  string device_model = 2;
  string manufacturer = 3;
  string android_version = 4;
  string app_version = 5;
  repeated string capability_ids = 6;
  map<string, string> metadata = 7;
}

message AndroidHeartbeat {
  AndroidAuth auth = 1;
  int64 timestamp_ms = 2;
  int32 battery_level = 3;
  bool screen_on = 4;
  bool locked = 5;
}

message AndroidEventEnvelope {
  AndroidAuth auth = 1;
  Event event = 2;
}

message AndroidCommandResult {
  AndroidAuth auth = 1;
  string command_id = 2;
  string capability_id = 3;
  Status status = 4;
  string result_json = 5;
}

message AndroidApprovalDecision {
  AndroidAuth auth = 1;
  string approval_id = 2;
  bool approved = 3;
  bool rejected = 4;
  bool global_reject = 5;
  string surface_id = 6;
  string user = 7;
  string reason = 8;
}

message AndroidClientMessage {
  oneof kind {
    AndroidRegister register = 1;
    AndroidHeartbeat heartbeat = 2;
    AndroidEventEnvelope event = 3;
    AndroidCommandResult command_result = 4;
    AndroidApprovalDecision approval_decision = 5;
  }
}

message AndroidStreamAck {
  string connection_id = 1;
  Status status = 2;
}

message AndroidInvokeCommand {
  string command_id = 1;
  string capability_id = 2;
  string method = 3;
  string params_json = 4;
  int64 timeout_ms = 5;
  string correlation_id = 6;
}

message AndroidApprovalCommand {
  string approval_id = 1;
  string title = 2;
  string body = 3;
  string state = 4;
  string summary_json = 5;
}

message AndroidServerHeartbeat {
  int64 timestamp_ms = 1;
}

message AndroidStopCommand {
  string reason = 1;
}

message AndroidChatHistoryMessage {
  string message_id = 1;
  string role = 2;
  string text = 3;
  int64 timestamp_ms = 4;
  string image = 5;
  string conversation_id = 6;
  string source = 7;
}

message AndroidChatUpdate {
  repeated AndroidChatHistoryMessage messages = 1;
}

message AndroidServerCommand {
  oneof kind {
    AndroidStreamAck ack = 1;
    AndroidInvokeCommand invoke = 2;
    AndroidApprovalCommand approval_request = 3;
    AndroidServerHeartbeat heartbeat = 4;
    AndroidStopCommand stop = 5;
    AndroidChatUpdate chat_update = 6;
  }
}

// ═══════════════════════════════════════════════════════════════
// Observe
// ═══════════════════════════════════════════════════════════════

message GetAndroidScreenshotRequest {
  int32 quality = 1;                // 1–100
}

message GetAndroidScreenshotResponse {
  Status status = 1;
  bytes image_data = 2;
  int32 width = 3;
  int32 height = 4;
}

message GetCurrentAppRequest {}

message GetCurrentAppResponse {
  Status status = 1;
  string package_name = 2;
  string activity_name = 3;
  string app_name = 4;
}

message GetUiTreeRequest {
  bool include_invisible = 1;       // Include non-visible nodes
}

message UiNode {
  string class_name = 1;
  string text = 2;
  string content_desc = 3;
  string resource_id = 4;
  bool is_clickable = 5;
  bool is_focusable = 6;
  int32 x = 7;
  int32 y = 8;
  int32 width = 9;
  int32 height = 10;
  repeated UiNode children = 11;
}

message GetUiTreeResponse {
  Status status = 1;
  UiNode root = 2;
}

message GetNotificationsRequest {
  int32 max_count = 1;              // 0 = all
}

message AndroidNotification {
  string key = 1;
  string package_name = 2;
  string app_name = 3;
  string title = 4;
  string text = 5;
  int64 posted_ms = 6;
  bool is_ongoing = 7;
  bool is_clearable = 8;
}

message GetNotificationsResponse {
  Status status = 1;
  repeated AndroidNotification notifications = 2;
}

message GetPermissionStatusRequest {}

message AndroidPermissionState {
  string name = 1;
  bool granted = 2;
  string detail = 3;
}

message GetPermissionStatusResponse {
  Status status = 1;
  repeated AndroidPermissionState permissions = 2;
  bool screen_locked = 3;
}

message AndroidGetDeviceStatusRequest {}

message AndroidGetDeviceStatusResponse {
  Status status = 1;
  string device_id = 2;
  string model = 3;
  string manufacturer = 4;
  string android_version = 5;
  int32 battery_level = 6;
  bool charging = 7;
  bool screen_on = 8;
  bool locked = 9;
}

message GetAccessibilityStatusRequest {}

message GetAccessibilityStatusResponse {
  Status status = 1;
  bool enabled = 2;
  string service_name = 3;
  string detail = 4;
}

message GetLocationRequest {
  string accuracy = 1;
}

message GetLocationResponse {
  Status status = 1;
  double latitude = 2;
  double longitude = 3;
  double accuracy_meters = 4;
  int64 captured_ms = 5;
}

// ═══════════════════════════════════════════════════════════════
// Input
// ═══════════════════════════════════════════════════════════════

message TapRequest {
  int32 x = 1;
  int32 y = 2;
  int32 duration_ms = 3;            // For long-press
}

message TapResponse {
  Status status = 1;
}

message SwipeRequest {
  int32 start_x = 1;
  int32 start_y = 2;
  int32 end_x = 3;
  int32 end_y = 4;
  int32 duration_ms = 5;
}

message SwipeResponse {
  Status status = 1;
}

message AndroidTypeTextRequest {
  string text = 1;
}

message AndroidTypeTextResponse {
  Status status = 1;
  int32 characters_typed = 2;
}

message PressBackRequest {}

message PressBackResponse {
  Status status = 1;
}

message PressHomeRequest {}

message PressHomeResponse {
  Status status = 1;
}

// ═══════════════════════════════════════════════════════════════
// App Control
// ═══════════════════════════════════════════════════════════════

message OpenAppRequest {
  string package_name = 1;
  string activity_name = 2;         // Optional — launch default if empty
}

message OpenAppResponse {
  Status status = 1;
}

message AndroidShowOverlayRequest {
  string text = 1;
  int32 x = 2;
  int32 y = 3;
  int32 duration_ms = 4;
  string color = 5;
}

message AndroidShowOverlayResponse {
  Status status = 1;
}

message AndroidApprovalRequest {
  string approval_id = 1;
  string title = 2;
  string body = 3;
  string summary_json = 4;
  int64 expires_at_ms = 5;
}

message AndroidApprovalResponse {
  Status status = 1;
  string surface_id = 2;
}

message AndroidEmergencyStopRequest {
  string reason = 1;
}

message AndroidEmergencyStopResponse {
  Status status = 1;
  bool stopped = 2;
}

syntax = "proto3";

package aegis;

option go_package = "github.com/Kohaku912/AEGIS/protos/aegis";

// Health check service for all AEGIS servers.
service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {}

message HealthCheckResponse {
  ServingStatus status = 1;
  string message = 2;
}

enum ServingStatus {
  UNKNOWN = 0;
  SERVING = 1;
  NOT_SERVING = 2;
}
